[package]
name = "caligula-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
chrono = { version = "0.4.44", features = ["serde"] }
env_logger = "0.11.10"
log = { version = "0.4.30", features = ["serde"] }
once_cell = "1.21.4"
rsfbclient = { version = "0.26.0", features = [
  "native_client",
  "dynamic_loading",
  "linking",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
shaku = { version = "0.6.2", features = ["thread_safe"] }
